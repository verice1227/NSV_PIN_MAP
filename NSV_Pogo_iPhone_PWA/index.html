<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174a72">
<title>NSV Pogo Pin Search</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NSV Pogo">
<meta name="format-detection" content="telephone=no">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f9;color:#17202a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#174a72;color:#fff;padding:20px 16px}
header h1{margin:0;font-size:1.45rem}
header p{margin:5px 0 0;opacity:.85}
.wrap{max-width:980px;margin:auto;padding:14px}
.card,.map-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 14px #00000012;margin-bottom:14px}
label{font-weight:750;display:block;margin-bottom:7px}
.form-row{display:grid;grid-template-columns:1fr;gap:12px}
input,textarea{width:100%;border:1px solid #bdc9d4;border-radius:10px;padding:12px;font-size:16px;background:#fff}
input{height:46px}
textarea{min-height:88px;resize:vertical}
.buttons{display:flex;gap:9px;margin-top:10px}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:750;cursor:pointer}
#go{background:#174a72;color:#fff;flex:1}
#clear{background:#e8edf2}
.note{font-size:.82rem;color:#647180;margin:8px 0 0}
.error{color:#b42318;font-weight:700;margin-top:8px}
.result{background:#fff;border-left:5px solid #174a72;border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 8px #0000000d}
.result small{display:block;color:#687585;margin-top:3px}
.result b{background:#e8f1f7;border-radius:999px;padding:7px 10px;white-space:nowrap}
.result.miss{border-color:#b42318}
.empty{text-align:center;color:#687585;padding:16px}
.map-card h2{font-size:1.05rem;margin:0 0 4px}
.map-subtitle{font-size:.84rem;color:#687585;margin:0 0 10px}
.grid-wrap{overflow:auto;padding-bottom:3px}
.pin-grid{display:grid;grid-template-columns:34px repeat(25,28px);gap:0;min-width:738px;border:4px solid #111;width:max-content}
.head,.pin{height:24px;border-right:1px solid #111;border-bottom:1px solid #111;text-align:center;display:flex;align-items:center;justify-content:center}
.head{font-size:12px;font-weight:700;background:#fac7a8}
.corner{background:#fac7a8}
.rowhead{font-size:13px;font-weight:500}
.pin{background:#fff;color:transparent}
.pin.hit{background:#fff200;color:#111;font-size:14px;font-weight:900;box-shadow:inset 0 0 0 2px #d4c900}

.ref-card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 3px 14px #00000012;margin-bottom:12px}
.ref-card h2{font-size:.95rem;margin:0 0 2px}
.ref-card p{font-size:.72rem;color:#687585;margin:0 0 7px}
.ref-wrap{overflow:hidden;padding-bottom:0}
.chassis-ref{display:grid;grid-template-columns:34px 20px repeat(4,minmax(24px,1fr)) 20px 34px;grid-template-rows:21px repeat(5,20px);gap:0;width:100%;margin:auto}
.refcell{border-right:1px solid #111;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:center;background:#fff;font-size:10px;line-height:1}
.refcell.top{border-top:1px solid #111}
.refcell.left{border-left:1px solid #111}
.refblock{font-weight:700;background:#f7f7f7}
.refchassis{font-weight:800;font-size:12px;border:1px solid #111;background:#fff}
.refsite{font-weight:650;background:#fff;font-size:10px}
.refblank{border:0;background:transparent}
.refhit{background:#fff200!important;box-shadow:inset 0 0 0 1.5px #d4c900;font-weight:900}
.refrowgap{height:8px}
.ref-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px 10px;align-items:start;width:100%;max-width:700px;margin:auto}
.ref-half{display:grid;grid-template-columns:34px 20px repeat(4,minmax(24px,1fr));grid-template-rows:21px repeat(5,20px);gap:0;width:100%;min-width:0;border:4px solid #111}
.ref-half.right{grid-template-columns:repeat(4,minmax(24px,1fr)) 20px 34px}
.ref-half .refcell{min-width:0}
@media(max-width:420px){
  .ref-card{padding:8px}
  .ref-card h2{font-size:.88rem}
  .ref-card p{font-size:.66rem}
  .ref-pair{gap:5px 6px}
  .ref-half{grid-template-columns:28px 17px repeat(4,minmax(20px,1fr));grid-template-rows:19px repeat(5,18px)}
  .ref-half.right{grid-template-columns:repeat(4,minmax(20px,1fr)) 17px 28px}
  .refcell{font-size:9px}
  .refsite{font-size:9px}
  .refchassis{font-size:10px}
}

/* Mobile-fit main pogo map */
@media(max-width:600px){
  .wrap{padding:8px}
  .map-card{padding:8px;border-radius:10px;margin-bottom:10px}
  .map-card h2{font-size:.92rem}
  .map-subtitle{font-size:.72rem;margin-bottom:6px}
  .grid-wrap{overflow:hidden;padding-bottom:0;width:100%}
  .pin-grid{
    grid-template-columns:18px repeat(25,minmax(0,1fr));
    width:100%;
    min-width:0;
    border-width:3px;
  }
  .head,.pin{height:18px;min-width:0;padding:0}
  .head{font-size:8px;font-weight:750}
  .rowhead{font-size:9px;font-weight:650}
  .pin.hit{font-size:10px;box-shadow:inset 0 0 0 1px #d4c900}
}

@media(min-width:700px){.wrap{padding:22px}.form-row{grid-template-columns:150px 150px 1fr}}
</style>
</head>
<body>
<header><h1>NSV Pogo Pin Search</h1><p id="count">Loading…</p></header>
<main class="wrap">
<section class="card">
  <div class="form-row">
    <div>
      <label for="chassis">Chassis number</label>
      <input id="chassis" type="number" min="1" max="4" inputmode="numeric" placeholder="1, 2, 3, or 4">
    </div>
    <div>
      <label for="site">Site number</label>
      <input id="site" type="number" min="1" max="5" inputmode="numeric" placeholder="1, 2, 3, 4, or 5">
    </div>
    <div>
      <label for="search">Signal name</label>
      <textarea id="search" list="signals" placeholder="Example: a_25&#10;For several pins, use commas or separate lines"></textarea>
      <datalist id="signals"></datalist>
    </div>
  </div>
  <div class="buttons"><button id="go">Search pin</button><button id="clear">Clear</button></div>
  <p class="note">Enter Chassis 1–4 and Site 1–5. Chassis 1 or 2 displays columns 25→1 with rows A→D. Chassis 3 or 4 displays columns 1→25 with rows D→A.</p>
  <div id="formError" class="error" hidden></div>
</section>
<section id="results"></section>
<section id="blockReference"></section>
<section id="maps"></section>
</main>

const $=s=>document.querySelector(s);
function norm(s){return s.trim().toLowerCase()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function queries(){return [...new Set($('#search').value.split(/[\n,;]+/).map(norm).filter(Boolean))]}
function chassisNumber(){return Number($('#chassis').value)}
function siteNumber(){return Number($('#site').value)}
function validChassis(n){return Number.isInteger(n)&&n>=1&&n<=4}
function validSite(n){return Number.isInteger(n)&&n>=1&&n<=5}
function find(q){const exact=DATA.filter(x=>x.signal.toLowerCase()===q);return exact.length?exact:DATA.filter(x=>x.signal.toLowerCase().includes(q)).slice(0,40)}
function orientation(chassis){
  if(chassis<=2) return {cols:Array.from({length:25},(_,i)=>25-i),rows:['A','B','C','D'],label:'Chassis 1 & 2 reference'};
  return {cols:Array.from({length:25},(_,i)=>i+1),rows:['D','C','B','A'],label:'Chassis 3 & 4 reference'};
}
function refHalf(chassis, side, hits){
 const leftSide=side==='left';
 const blocks=leftSide?[1,2,3,4]:[4,3,2,1];
 const sites=leftSide?[1,2,3,4,5]:[5,4,3,2,1];
 let h=`<div class="ref-half ${leftSide?'left':'right'}">`;
 if(leftSide){
   h+=`<div class="refcell refblank"></div><div class="refcell refblank"></div>`;
   for(const b of blocks) h+=`<div class="refcell refblock top">B${b}</div>`;
 } else {
   for(const b of blocks) h+=`<div class="refcell refblock top">B${b}</div>`;
   h+=`<div class="refcell refblank"></div><div class="refcell refblank"></div>`;
 }
 sites.forEach((site,idx)=>{
   if(leftSide){
     if(idx===0) h+=`<div class="refcell refchassis left" style="grid-row:2 / span 5;grid-column:1">C${chassis}</div>`;
     h+=`<div class="refcell refsite left" style="grid-column:2">${site}</div>`;
     for(const b of blocks){const hit=hits.has(`${chassis}-${site}-${b}`);h+=`<div class="refcell ${hit?'refhit':''}"></div>`}
   } else {
     for(const b of blocks){const hit=hits.has(`${chassis}-${site}-${b}`);h+=`<div class="refcell ${hit?'refhit':''}"></div>`}
     h+=`<div class="refcell refsite">${site}</div>`;
     if(idx===0) h+=`<div class="refcell refchassis" style="grid-row:2 / span 5;grid-column:6">C${chassis}</div>`;
   }
 });
 return h+'</div>';
}
function renderBlockReference(chassis,site,matches){
 const hits=new Set(matches.map(m=>`${chassis}-${site}-${m.block}`));
 return `<section class="ref-card"><h2>Chassis / Site / Block Reference</h2><p>Yellow shows the selected chassis, site, and block from the signal lookup.</p><div class="ref-wrap"><div class="ref-pair">${refHalf(1,'left',hits)}${refHalf(4,'right',hits)}${refHalf(2,'left',hits)}${refHalf(3,'right',hits)}</div></div></section>`;
}
function grid(block,matches,chassis){
 const selected=new Map(matches.filter(x=>x.block===block).map(x=>[`${x.row}-${x.column}`,x]));
 const o=orientation(chassis);
 let h=`<section class="map-card"><h2>Block ${block}</h2><p class="map-subtitle">${o.label} — selected Chassis ${chassis}</p><div class="grid-wrap"><div class="pin-grid"><div class="head corner"></div>`;
 h+=o.cols.map(c=>`<div class="head">${c}</div>`).join('');
 for(const r of o.rows){h+=`<div class="head rowhead">${r}</div>`;for(const c of o.cols){const m=selected.get(`${r}-${c}`);h+=`<div class="pin ${m?'hit':''}" title="${m?escapeHtml(m.signal):''}">${m?'●':''}</div>`}}
 return h+'</div></div></section>';
}
function render(){
 const chassis=chassisNumber();
 const site=siteNumber();
 const err=$('#formError');
 if(!validChassis(chassis)){err.hidden=false;err.textContent='Enter a chassis number from 1 to 4.';$('#results').innerHTML='';$('#blockReference').innerHTML='';$('#maps').innerHTML='';return}
 if(!validSite(site)){err.hidden=false;err.textContent='Enter a site number from 1 to 5.';$('#results').innerHTML='';$('#blockReference').innerHTML='';$('#maps').innerHTML='';return}
 err.hidden=true;err.textContent='';
 const qs=queries();
 if(!qs.length){$('#results').innerHTML='<div class="empty">Type a signal name, then tap Search.</div>';$('#blockReference').innerHTML='';$('#maps').innerHTML='';return}
 const matches=[];let cards='';
 for(const q of qs){const ms=find(q);if(!ms.length){cards+=`<article class="result miss"><strong>${escapeHtml(q)}</strong><span>Not found</span></article>`;continue}for(const m of ms){matches.push(m);cards+=`<article class="result"><div><strong>${escapeHtml(m.signal)}</strong><small>Chassis ${chassis} • Site ${site} • Block ${m.block}, Row ${m.row}, Column ${m.column}</small></div><b>${m.location}</b></article>`}}
 const unique=[...new Map(matches.map(x=>[x.location,x])).values()];
 $('#results').innerHTML=cards;
 $('#blockReference').innerHTML=renderBlockReference(chassis,site,unique);
 const blocks=[...new Set(unique.map(x=>x.block))].sort((a,b)=>a-b);
 $('#maps').innerHTML=blocks.map(b=>grid(b,unique,chassis)).join('');
}
$('#go').onclick=render;
$('#clear').onclick=()=>{$('#search').value='';$('#chassis').value='';$('#site').value='';$('#formError').hidden=true;$('#results').innerHTML='<div class="empty">Enter a chassis number, site number, and signal name.</div>';$('#blockReference').innerHTML='';$('#maps').innerHTML='';$('#chassis').focus()};
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();render()}});
$('#chassis').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#site').focus()}});
$('#site').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#search').focus()}});
$('#count').textContent=`${DATA.length} mapped pogo-pin positions`;
const names=[...new Set(DATA.map(x=>x.signal))].sort((a,b)=>a.localeCompare(b));
$('#signals').innerHTML=names.map(x=>`<option value="${escapeHtml(x)}"></option>`).join('');
$('#results').innerHTML='<div class="empty">Enter a chassis number, site number, and signal name.</div>';
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
